{% extends 'polls/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">Управление голосованием: <strong>{{ election.title }}</strong></h2>

        <!-- Описание голосования -->
        <p><strong>Описание:</strong> {{ election.description|default:"<em>Нет описания</em>"|safe }}</p>


        <!-- Кнопки управления -->
        <div class="d-flex gap-2 mb-4">

            <a href="{% url 'edit_election' election.id %}" class="btn btn-warning">
                <i class="bi bi-pencil-square"></i> Редактировать голосование
            </a>
        </div>

        <!-- Удаление голосования -->
        <form method="post" action="{% url 'delete_election' election.id %}" onsubmit="return confirm('Вы уверены, что хотите удалить это голосование? Это действие необратимо.');">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash-fill"></i> Удалить голосование
            </button>
        </form>

        <hr class="my-4">

        <a href="{% url 'home' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Назад
        </a>
    </div>
</div>
{% endblock %}

{% extends 'polls/base.html' %}

{% block content %}
<div class="container mt-5">
  <h2>Результаты поиска по: "{{ query }}"</h2>

  {% if users %}
    <ul class="list-group">
      {% for user in users %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ user.username }}</span>
        <a href="{% url 'user_profile' user.id %}" class="btn btn-outline-info btn-sm">Профиль</a>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="alert alert-warning mt-3">Пользователи не найдены.</div>
  {% endif %}
</div>
{% endblock %}
